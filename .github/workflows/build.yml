name: Build Windows and Linux (Qt)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: "6.10.1"
  BUILD_TYPE: Release

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build-win `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build application
        run: cmake --build build-win --config Release --parallel 2

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $exe = Get-ChildItem build-win -Recurse -Filter EnsteinStockManager.exe |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $exe) {
            throw "EnsteinStockManager.exe was not found."
          }

          $deployDir = Split-Path $exe -Parent
          & windeployqt --release --qmldir "$PWD\qml" "$exe"

          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed."
          }

          Write-Host "Deployment directory: $deployDir"

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $exe = Get-ChildItem build-win -Recurse -Filter EnsteinStockManager.exe |
            Select-Object -First 1 -ExpandProperty FullName

          $deployDir = Split-Path $exe -Parent
          Compress-Archive -Path "$deployDir\*" `
            -DestinationPath "EnsteinStockManager-Windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnsteinStockManager-Windows
          path: EnsteinStockManager-Windows.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libfuse2 \
            wget \
            file \
            libpq-dev \
            libpq5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"    
             
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtmultimedia
          setup-python: true
          py7zrversion: "==1.1.*"
          cache: true

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build application
        run: cmake --build build --parallel 2

      - name: Prepare AppDir
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps

          APP_EXE="$(find build -type f -executable -name 'EnsteinStockManager' -print -quit)"

          if [ -z "$APP_EXE" ]; then
            echo "ERROR: EnsteinStockManager executable was not found."
            find build -maxdepth 5 -type f -executable -print
            exit 1
          fi

          cp "$APP_EXE" AppDir/usr/bin/EnsteinStockManager
          chmod +x AppDir/usr/bin/EnsteinStockManager

          cat > AppDir/usr/share/applications/enstein-stock-manager.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Enstein Stock Manager
          Exec=EnsteinStockManager
          Icon=enstein-stock-manager
          Categories=Office;Utility;
          Terminal=false
          EOF

          if [ -f resources/enstein_logo.png ]; then
            cp resources/enstein_logo.png AppDir/usr/share/icons/hicolor/256x256/apps/enstein-stock-manager.png
          elif [ -f resources/ENSTEIN.png ]; then
            cp resources/ENSTEIN.png AppDir/usr/share/icons/hicolor/256x256/apps/enstein-stock-manager.png
          else
            echo "No app icon found; continuing without a custom icon."
          fi

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          export QML_SOURCES_PATHS="$PWD/qml"

          QT_QMAKE="$(command -v qmake)"
          if [ -z "$QT_QMAKE" ]; then
            echo "ERROR: qmake was not found."
            exit 1
          fi

          QT_PLUGIN_DIR="$("$QT_QMAKE" -query QT_INSTALL_PLUGINS)"
          SQL_DRIVER_DIR="$QT_PLUGIN_DIR/sqldrivers"
          PSQL_PLUGIN="$SQL_DRIVER_DIR/libqsqlpsql.so"

          if [ ! -f "$PSQL_PLUGIN" ]; then
            echo "ERROR: PostgreSQL Qt SQL driver not found: $PSQL_PLUGIN"
            ls -la "$SQL_DRIVER_DIR" || true
            exit 1
          fi

          # Temporarily hide unused SQL drivers (Oracle, Firebird, etc.)
          # so linuxdeploy does not fail on their missing vendor libraries.
          SQL_BACKUP="$(mktemp -d)"

          restore_sql_drivers() {
            if [ -d "$SQL_BACKUP" ]; then
              find "$SQL_BACKUP" -mindepth 1 -maxdepth 1 \
                -exec mv -t "$SQL_DRIVER_DIR" -- {} + 2>/dev/null || true
              rmdir "$SQL_BACKUP" 2>/dev/null || true
            fi
          }

          trap restore_sql_drivers EXIT

          find "$SQL_DRIVER_DIR" -maxdepth 1 \
            \( -type f -o -type l \) \
            -name 'libqsql*.so*' \
            ! -name 'libqsqlpsql.so' \
            -exec mv -t "$SQL_BACKUP" -- {} +

          # Deploy the Qt and QML runtime.
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt

          # Ensure the PostgreSQL driver is packaged.
          mkdir -p AppDir/usr/plugins/sqldrivers

          if [ ! -f AppDir/usr/plugins/sqldrivers/libqsqlpsql.so ]; then
            cp "$PSQL_PLUGIN" AppDir/usr/plugins/sqldrivers/libqsqlpsql.so
          fi

          # Bundle the PostgreSQL driver's shared-library dependencies.
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --deploy-deps-only AppDir/usr/plugins/sqldrivers/libqsqlpsql.so

          # Create the AppImage.
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --output appimage

          APPIMAGE_FILE="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"

          if [ -z "$APPIMAGE_FILE" ]; then
            echo "ERROR: AppImage was not created."
            exit 1
          fi

          mv "$APPIMAGE_FILE" EnsteinStockManager-Linux.AppImage
          chmod +x EnsteinStockManager-Linux.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnsteinStockManager-Linux-AppImage
          path: EnsteinStockManager-Linux.AppImage
          if-no-files-found: error

  release:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: EnsteinStockManager-Windows
          path: release-files

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: EnsteinStockManager-Linux-AppImage
          path: release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true